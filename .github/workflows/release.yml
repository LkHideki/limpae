name: Release

# Pushing a tag like v0.2.0 builds the DMG. It is published to a draft GitHub Release only when it is signed with
# a Developer ID and notarized; without those secrets the unsigned DMG is kept as a workflow artifact for testing,
# never published (Gatekeeper would block it on other Macs).
#
# Secrets: APPLE_CERTIFICATE_P12 (base64 of the Developer ID Application .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"), APPLE_ID, APPLE_TEAM_ID,
# APPLE_APP_PASSWORD (an app-specific password).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Import the signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          xcrun notarytool store-credentials limpae-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$KC"

      - name: Build the DMG
        env:
          LIMPAE_DEVELOPER_ID: ${{ env.HAS_SIGNING == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          LIMPAE_NOTARY_PROFILE: ${{ env.HAS_SIGNING == 'true' && 'limpae-notary' || '' }}
        run: scripts/release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: limpae-dmg
          path: dist/*

      - name: Draft the GitHub Release
        if: env.HAS_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Limpae ${GITHUB_REF_NAME#v}" --generate-notes
