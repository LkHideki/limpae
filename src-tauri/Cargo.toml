[package]
name = "limpae"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Limpae: a careful disk cleaner for macOS"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
limpa-core = { path = "../crates/limpa-core" }

# Native Quick Look panel (src-tauri/src/quicklook.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSPanel"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSURL"] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "QLPreviewItem", "QLPreviewPanel"] }

[features]
default = ["custom-protocol"]
# Serves the embedded frontend instead of devUrl; required for any build that is shipped or run directly.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.27.0"
